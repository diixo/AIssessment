
{% extends "app_main/base.html" %}

{% block meta %}
<title>{{ title }}</title>
<meta property="og:title" content="Scheduler">
<meta name="description" content="Scheduler">
<meta property="og:description" content="Scheduler">
{% endblock %}

{% block extra_style %}
  <style>
    .tree-node { cursor: pointer; user-select: none; }
    .node-children {
      margin-left: 1.5rem;
      list-style: none;
      padding-left: 0;
    }
    .collapse-icon {
      width: 1.125rem;
      display:inline-block;
      text-align:center;
      cursor:pointer;
    }
    .node-label { margin-left: .25rem; }
    .selected-count { min-width: 6rem; }
    .search-highlight { background: rgb(255, 144, 64); }
    .tree-node-item { margin-bottom: 0.25rem; }
  </style>
{% endblock %}

{% block content %}


<div class="py-4">
  <h5>Confluence: Select Pages</h5>

  <div class="mt-4 mb-3 d-flex gap-2">
    <input id="treeSearch" class="form-control me-auto rounded-3" type="search" placeholder="Search title..." />
    <button id="expandAllBtn" class="btn btn-outline-secondary text-nowrap">Expand all</button>
    <button id="collapseAllBtn" class="btn btn-outline-secondary text-nowrap">Collapse all</button>
    <button id="selectAllBtn" class="btn btn-outline-secondary text-nowrap">Select all</button>
    <button id="clearAllBtn" class="btn btn-outline-secondary">Clear</button>
  </div>



  <form method="post" id="treeForm">
    {% csrf_token %}

    <div class="mb-3">
      <div class="ms-3">Found: <strong id="foundCount">0</strong></div>
      <div class="ms-3">
        <span>Selected:</span>
        <input type="text" class="form-control-plaintext fw-bold d-inline-block" id="selectedCount" name="selected_count" value="0" readonly style="width:auto;">
      </div>
    </div>

    <input type="hidden" name="selected_nodes" id="selectedNodesInput" value="" >

    <div class="border rounded-3 pb-3 pt-4" id="treeContainer" style="max-height:60vh; overflow:auto; background:#fff;">
      <div id="treeRoot">Loading...</div>
    </div>

    <div class="mt-3 d-flex gap-2">
      <button type="submit" name="action" value="save_selected" id="btnSaveSelected" class="btn btn-primary">Save selected</button>
      <button type="submit" name="action" value="cancel_selected" class="btn btn-secondary">Cancel</button>
      <button type="button" id="btnShowSelected" class="btn btn-outline-primary">Show selected</button>
    </div>
  </form>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

  window.TREE_DATA = {{ tree_json|safe }};

  async function selection(space, includeIds, excludeIds = []) {
    const res = await fetch('http://127.0.0.1:8001/confluence/selection', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        space,
        include_ids: includeIds,
        exclude_ids: excludeIds
      }),
    });
    if (!res.ok) {
      throw new Error("Server returned " + res.status);
    }
    return res.json();
  }


  (function () {
    const data = window.TREE_DATA || {};
    const nodes = data.nodes || {};
    const rootId = data.root_page_id;

    const treeRootEl = document.getElementById('treeRoot');
    const selectedCountEl = document.getElementById('selectedCount');
    const selectedNodesInput = document.getElementById('selectedNodesInput');
    const treeSearch = document.getElementById('treeSearch');
    const foundCountEl = document.getElementById('foundCount');

    // track selected ids (Set)
    const selected = new Set();

    // utility: create element helper
    function el(tag, attrs = {}, ...children) {
      const e = document.createElement(tag);
      for (const k in attrs) {
        if (k === 'class') e.className = attrs[k];
        else if (k === 'dataset') {
          for (const d in attrs[k]) e.dataset[d] = attrs[k][d];
        } else if (k === 'html') e.innerHTML = attrs[k];
        else e.setAttribute(k, attrs[k]);
      }
      for (const c of children) {
        if (c == null) continue;
        e.append(typeof c === 'string' ? document.createTextNode(c) : c);
      }
      return e;
    }

    function buildNodeItem(nodeId) {
      const node = nodes[nodeId] || { title: nodeId, children: [] };
      const hasChildren = Array.isArray(node.children) && node.children.length > 0;

      const li = el('li', { class: 'tree-node-item' });

      const collapseIcon = el('span', { class: 'collapse-icon' }, hasChildren ? '▸' : '');
      const checkbox = el('input', { type: 'checkbox', id: 'cb-' + nodeId });
      checkbox.dataset.nodeId = nodeId;
      checkbox.className = 'form-check-input';

      const label = el('label', { class: 'node-label' }, node.title || nodeId);
      label.dataset.nodeId = nodeId;

      const container = el('div', {});
      container.append(collapseIcon, checkbox, label);
      li.append(container);

      if (hasChildren) {
        const ul = el('ul', { class: 'node-children d-none', id: 'children-' + nodeId });
        for (const childId of node.children) {
          ul.append(buildNodeItem(childId));
        }
        li.append(ul);

        collapseIcon.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (ul.classList.contains('d-none')) {
            ul.classList.remove('d-none');
            collapseIcon.textContent = '▾';
          } else {
            ul.classList.add('d-none');
            collapseIcon.textContent = '▸';
          }
        });
      }

      // checkbox change: select/unselect subtree
      checkbox.addEventListener('change', (ev) => {
        const checked = ev.target.checked;
        toggleSelect(nodeId, checked);
        updateSelectedCount();
      });

      // clicking label toggles checkbox
      label.addEventListener('click', () => {
        checkbox.checked = !checkbox.checked;
        toggleSelect(nodeId, checkbox.checked);
        updateSelectedCount();
      });

      return li;
    }

    // select/unselect node and its descendants
    function toggleSelect(nodeId, checked) {
      const targetCb = document.getElementById('cb-' + nodeId);
      if (targetCb) targetCb.checked = checked;
      if (checked) selected.add(nodeId); else selected.delete(nodeId);

      const node = nodes[nodeId] || { children: [] };
      if (Array.isArray(node.children)) {
        for (const ch of node.children) toggleSelect(ch, checked);
      }
    }

    function updateSelectedCount() {
      //selectedCountEl.textContent = selected.size;
      selectedCountEl.value = selected.size;
      selectedNodesInput.value = Array.from(selected).join(',');
    }

    function updateFoundCount(n) {
      //foundCountEl.textContent = n;
      foundCountEl.value = n;
    }

    // build entire tree (starting from root). If no explicit root, build all top-level nodes.
    function renderTree() {
      treeRootEl.innerHTML = '';
      const ul = el('ul', { class: 'node-children' });
      if (rootId && nodes[rootId]) {
        ul.append(buildNodeItem(rootId));
      } else {
        // if no root, render all nodes that are not children of others (top-level)
        const allIds = Object.keys(nodes);
        const childSet = new Set();
        for (const id of allIds) {
          (nodes[id].children || []).forEach(c => childSet.add(c));
        }
        const topLevel = allIds.filter(id => !childSet.has(id));
        topLevel.forEach(id => ul.append(buildNodeItem(id)));
      }
      treeRootEl.append(ul);
      updateSelectedCount();
    }

    // expand/collapse helpers
    function setAllExpanded(expand) {
      const uls = treeRootEl.querySelectorAll('.node-children');
      for (const ul of uls) {
        // do not touch root ul-element
        if (ul.parentElement === treeRootEl) continue;
        if (expand) ul.classList.remove('d-none');
        else ul.classList.add('d-none');
      }

      for (const icon of treeRootEl.querySelectorAll('.collapse-icon')) {
        if (icon.textContent.trim() === '') continue;
        icon.textContent = expand ? '▾' : '▸';
      }
    }

    // select all / clear all
    function selectAll(yes) {
      const allIds = Object.keys(nodes);
      for (const id of allIds) {
        const cb = document.getElementById('cb-' + id);
        if (cb) cb.checked = yes;
        if (yes) selected.add(id); else selected.delete(id);
      }
      updateSelectedCount();
    }

    // search (simple case-insensitive title search)
    function searchTree(q) {
      const ql = (q || '').trim().toLowerCase();
      let found_count = 0;

      if (!ql) {
        // clear highlights and show all
        for (const li of treeRootEl.querySelectorAll('li')) {
          li.style.display = '';
          const label = li.querySelector('.node-label');
          if (label) label.innerHTML = label.textContent; // remove highlights
        }
        // also collapse children if you want, here we keep current expanded/collapsed state
        console.log("Search cleared. Matches: 0");
        updateFoundCount(0);
        updateSelectedCount();
        return;
      }

      // First hide everything; we'll unhide matches and their ancestors
      for (const li of treeRootEl.querySelectorAll('li')) {
        li.style.display = 'none';
        const label = li.querySelector('.node-label');
        if (label) label.innerHTML = label.textContent;
      }
      // Also hide all child ULs (so we can reveal only needed branches)
      for (const ul of treeRootEl.querySelectorAll('.node-children')) {
        ul.classList.add('d-none');
      }

      // Now find matches
      for (const li of treeRootEl.querySelectorAll('li')) {
        const label = li.querySelector('.node-label');
        const text = label ? label.textContent.toLowerCase() : '';

        if (text.includes(ql)) {
          found_count++;

          // highlight in label
          const orig = label.textContent;
          const re = new RegExp(`(${escapeRegExp(ql)})`, 'ig');
          label.innerHTML = orig.replace(re, '<span class="search-highlight">$1</span>');

          // show this li
          li.style.display = '';

          // show ancestors: li and their ul containers, and set icon to expanded
          let p = li.parentElement;
          while (p && p !== treeRootEl) {
            // if this is a UL with class node-children — unhide it
            if (p.classList && p.classList.contains('node-children')) {
              p.classList.remove('d-none');
              // also ensure the parent LI (p.parentElement) is visible
              const parentLi = p.parentElement;
              if (parentLi && parentLi.tagName === 'LI') parentLi.style.display = '';
              // set collapse icon in parentLi to '▾' (expanded)
              if (parentLi) {
                const icon = parentLi.querySelector('.collapse-icon');
                if (icon && icon.textContent.trim() !== '') icon.textContent = '▾';
              }
            }
            p = p.parentElement;
          }
        }
      }

      console.log(`Search query "${ql}" → matches: ${found_count}`);
      updateFoundCount(found_count);
      updateSelectedCount();
    }

    function escapeRegExp(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // events
    document.getElementById('expandAllBtn').addEventListener('click', () => setAllExpanded(true));
    document.getElementById('collapseAllBtn').addEventListener('click', () => setAllExpanded(false));
    document.getElementById('selectAllBtn').addEventListener('click', () => selectAll(true));
    document.getElementById('clearAllBtn').addEventListener('click', () => selectAll(false));
    document.getElementById('btnShowSelected').addEventListener('click', () => {
      alert('Selected ids:\n' + Array.from(selected).join('\n') || '(none)');
    });

    document.getElementById('btnSaveSelected').addEventListener('click', async () => {

        const includeIds = Array.from(selected);
        const space = "{{ space }}" || "SWT1AQ";
        const excludeIds = [];

        if (includeIds.length === 0) {
          alert("Nothing selected.");
          return;
        }

        try {
          const result = await selection(space, includeIds, excludeIds);

          console.log("Saved:", result);
          alert("Saved! OK = " + result.ok);

        } catch (err) {
          console.error("Save failed", err);
          alert("Error: " + err.message);
        }
    });

    treeSearch.addEventListener('input', (e) => {
      searchTree(e.target.value);
    });

    // initial render
    renderTree();
  })();

</script>
{% endblock %}
